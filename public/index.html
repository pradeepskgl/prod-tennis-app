<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AO Tennis Tournament Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
  <h1>🏆 AO Tennis Tournament - July 18 &amp; 19</h1>
  <div id="authArea" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;"></div>
</header>
<main>

  <div id="dayTabs" style="margin-bottom: 14px; display: none;">
    <button onclick="renderDay(1)" id="dayBtn1">Day 1 - July 18</button>
    <button class="secondary" onclick="renderDay(2)" id="dayBtn2">Day 2 - July 19</button>
  </div>

  <div id="tournamentAdmin" style="display:none; margin-bottom: 16px;"></div>
  <div id="tournamentList" style="margin-bottom: 16px;"></div>
  <div id="legacyTournamentSection" style="margin-bottom: 16px; display: none;"></div>
  <div id="matchList"></div>
</main>

<script src="/js/api.js"></script>
<script>
let currentDay = 1;
let isAdmin = false;
let setupComplete = true;
let bracket = [];
let tournaments = [];
let hiddenTournaments = [];
let selectedTournamentId = null;

function roundIsDay1(round) {
  return ['Play-In', 'Round of 16'].includes(round);
}

async function checkAuth() {
  try {
    await Api.get('/api/auth/me');
    isAdmin = true;
  } catch (e) {
    isAdmin = false;
  }
}

async function checkSetup() {
  const status = await Api.get('/api/auth/status');
  setupComplete = status.setupComplete;
}

function renderAuthArea() {
  const el = document.getElementById('authArea');

  if (!setupComplete) {
    el.innerHTML = `
      <span class="small-note">Set admin passcode:</span>
      <input id="setupPasscode" type="password" placeholder="Min 4 chars" style="width:140px;">
      <button onclick="doSetup()">Set Passcode</button>
      <span id="setupError" class="error-msg"></span>
    `;
    return;
  }

  if (isAdmin) {
    el.innerHTML = `
      <span class="small-note">Admin session active</span>
      <button class="secondary" onclick="doLogout()">Logout</button>
    `;
    return;
  }

  el.innerHTML = `
    <input id="loginPasscode" type="password" placeholder="Admin passcode" style="width:140px;" onkeydown="if(event.key==='Enter') doLogin();">
    <button onclick="doLogin()">Login</button>
    <span id="loginError" class="error-msg"></span>
  `;
}

async function doSetup() {
  const passcode = document.getElementById('setupPasscode').value;
  try {
    await Api.post('/api/auth/setup', { passcode });
    setupComplete = true;
    renderAuthArea();
  } catch (e) {
    document.getElementById('setupError').textContent = e.message;
  }
}

async function doLogin() {
  const passcode = document.getElementById('loginPasscode').value;
  try {
    await Api.post('/api/auth/login', { passcode });
    isAdmin = true;
    renderAuthArea();
    await loadBracket();
  } catch (e) {
    document.getElementById('loginError').textContent = e.message;
  }
}

async function doLogout() {
  await Api.post('/api/auth/logout');
  isAdmin = false;
  renderAuthArea();
  await loadBracket();
}

async function loadBracket() {
  bracket = await Api.get('/api/bracket');
  tournaments = await Api.get('/api/bracket/tournaments');
  if (isAdmin) {
    try {
      hiddenTournaments = await Api.get('/api/bracket/tournaments/hidden');
    } catch (e) {
      hiddenTournaments = [];
    }
  }
  
  // Filter out hidden tournaments
  const visibleTournaments = tournaments.filter(t => !t.hiddenFromUI);
  
  if (visibleTournaments.length) {
    selectedTournamentId = visibleTournaments[0]._id;
  } else if (tournaments.length) {
    selectedTournamentId = tournaments[0]._id;
  }
  
  renderTournaments();
  renderLegacyTournaments();
  renderDay(currentDay);
}

function renderTournaments() {
  const listEl = document.getElementById('tournamentList');
  const adminEl = document.getElementById('tournamentAdmin');
  
  // Filter visible tournaments
  const visibleTournaments = tournaments.filter(t => !t.hiddenFromUI);
  
  if (!isAdmin) {
    adminEl.style.display = 'none';
  } else {
    adminEl.style.display = 'block';
    adminEl.innerHTML = `
      <div class="session-block">
        <div class="session-title">Create tournament</div>
        <div class="field-row">
          <label>Tournament name</label><input id="tourName" value="New Tournament">
        </div>
        <div class="field-row">
          <label>Date range</label><input id="tourDate" value="Upcoming">
        </div>
        <div class="field-row">
          <label>Match type</label>
          <select id="tourMatchType">
            <option value="fast4">Fast4</option>
            <option value="regular">Regular sets</option>
          </select>
        </div>
        <div class="field-row">
          <label>3rd set</label>
          <select id="tourThirdSet">
            <option value="match_tiebreak">10-point match tiebreak</option>
            <option value="regular_set">Regular 3rd set</option>
          </select>
        </div>
        <button onclick="createTournament()">Create new tournament</button>
      </div>
    `;
  }

  if (!visibleTournaments.length) {
    listEl.innerHTML = '<p class="small-note">No active tournaments. View legacy tournaments below.</p>';
    return;
  }

  const currentTournament = visibleTournaments.find(t => t._id === selectedTournamentId) || visibleTournaments[0];
  selectedTournamentId = currentTournament._id;
  const filteredMatches = bracket.filter(m => m.tournamentId === selectedTournamentId);
  
  listEl.innerHTML = `
    <div class="session-block">
      <div class="session-title">Tournaments</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;">
        ${visibleTournaments.map(t => `
          <div style="display:flex; gap:4px; align-items:center;">
            <button class="${t._id === selectedTournamentId ? '' : 'secondary'}" onclick="selectTournament('${t._id}')">${t.name}</button>
            ${isAdmin ? `<button style="padding:4px 6px; font-size:12px;" onclick="hideTournament('${t._id}')">Hide</button>` : ''}
          </div>
        `).join('')}
      </div>
      <div class="match-meta">Showing: <b>${currentTournament.name}</b> · ${currentTournament.matchType === 'fast4' ? 'Fast4' : 'Regular sets'} · 3rd set: ${currentTournament.thirdSetFormat === 'regular_set' ? 'Regular 3rd set' : '10-point match tiebreak'}</div>
      ${isAdmin ? `<button onclick="seedTournament('${currentTournament._id}')">Seed tournament bracket</button>` : ''}
      ${isAdmin && currentTournament.status !== 'completed' ? `<button class="secondary" onclick="completeTournament('${currentTournament._id}')">Mark as completed</button>` : ''}
    </div>
  `;

  const matches = filteredMatches.filter(m => (currentDay === 1) === roundIsDay1(m.round));
  const list = document.getElementById('matchList');
  list.innerHTML = matches.map(m => {
    const winnerName = m.status === 'completed' && m.score && m.score.winner ? m[m.score.winner].name : null;
    const started = m.startedAt ? new Date(m.startedAt).toLocaleString() : 'Not started';
    const completed = m.completedAt ? new Date(m.completedAt).toLocaleString() : 'In progress';
    return `
    <div class="match-card" onclick="location.href='/match.html?m=${m.matchNumber}'">
      <div>
        <div class="match-meta">Match ${m.matchNumber} - ${m.round} - ${m.session} - ${m.scheduledStart} to ${m.scheduledEnd}</div>
        <div class="match-players">${m.player1.name} vs ${m.player2.name}</div>
        <div class="match-meta">Started: ${started} · Ended: ${completed}</div>
        ${winnerName ? `<div class="match-meta" style="color:#ffd479;">Winner: ${winnerName} 🏆</div>` : ''}
      </div>
      <span class="badge ${m.status}">${m.status.replace('_',' ')}</span>
    </div>
  `;
  }).join('') || '<p class="small-note">No matches yet for this tournament.</p>';
}

function renderLegacyTournaments() {
  const legacyEl = document.getElementById('legacyTournamentSection');
  const hiddenTourns = tournaments.filter(t => t.hiddenFromUI);
  const emptyTourns = tournaments.filter(t => !t.isLegacy && !t.hiddenFromUI && bracket.filter(m => m.tournamentId === t._id).length === 0);
  
  if (!isAdmin || (hiddenTourns.length === 0 && emptyTourns.length === 0)) {
    legacyEl.style.display = 'none';
    return;
  }
  
  legacyEl.style.display = 'block';
  let content = '';
  
  if (hiddenTourns.length > 0) {
    content += `
      <div class="session-block" style="opacity: 0.85;">
        <div class="session-title" style="cursor: pointer; user-select: none;" onclick="toggleHiddenTournaments()">
          📦 Hidden Tournaments (<span id="hiddenCount">${hiddenTourns.length}</span>) - Click to expand
        </div>
        <div id="hiddenTournamentList" style="display: none; margin-top: 12px;">
          ${hiddenTourns.map(t => `
            <div style="display:flex; gap:8px; align-items:center; padding:8px; background:#f5f5f5; border-radius:4px; margin-bottom:6px; color:#222;">
              <span style="flex:1; color:#333;"><b>${t.name}</b> · ${t.dateRange} · ${t.status}</span>
              <button style="padding:4px 8px; font-size:12px;" onclick="showTournament('${t._id}')">Restore</button>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }
  
  if (emptyTourns.length > 0) {
    content += `
      <div class="session-block" style="opacity: 0.85; border: 1px dashed #ccc;">
        <div class="session-title" style="cursor: pointer; user-select: none;" onclick="toggleEmptyTournaments()">
          ⚠️ Empty Tournaments (<span id="emptyCount">${emptyTourns.length}</span>) - Click to expand
        </div>
        <div id="emptyTournamentList" style="display: none; margin-top: 12px;">
          ${emptyTourns.map(t => `
            <div style="display:flex; gap:8px; align-items:center; padding:8px; background:#fff9e6; border-radius:4px; margin-bottom:6px; color:#222;">
              <span style="flex:1; color:#555;"><b>${t.name}</b> · ${t.dateRange} · (Not seeded)</span>
              <button style="padding:4px 8px; font-size:12px; background:#ff6b6b; color:white; border:none; border-radius:3px; cursor:pointer;" onclick="deleteTournament('${t._id}')">Delete</button>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }
  
  legacyEl.innerHTML = content;
}

function toggleHiddenTournaments() {
  const list = document.getElementById('hiddenTournamentList');
  if (list) {
    list.style.display = list.style.display === 'none' ? 'block' : 'none';
  }
}

function toggleEmptyTournaments() {
  const list = document.getElementById('emptyTournamentList');
  if (list) {
    list.style.display = list.style.display === 'none' ? 'block' : 'none';
  }
}

function renderDay(day) {
  currentDay = day;
  
  // Only show day tabs if viewing a legacy tournament
  const legacyTournament = tournaments.find(t => t.isLegacy && t._id === selectedTournamentId);
  const dayTabs = document.getElementById('dayTabs');
  if (legacyTournament) {
    dayTabs.style.display = 'block';
    document.getElementById('dayBtn1').className = day === 1 ? '' : 'secondary';
    document.getElementById('dayBtn2').className = day === 2 ? '' : 'secondary';
  } else {
    dayTabs.style.display = 'none';
  }
  
  renderTournaments();
}

async function createTournament() {
  const name = document.getElementById('tourName').value;
  const dateRange = document.getElementById('tourDate').value;
  const matchType = document.getElementById('tourMatchType').value;
  const thirdSetFormat = document.getElementById('tourThirdSet').value;
  const created = await Api.post('/api/bracket/tournaments', { name, dateRange, matchType, thirdSetFormat });
  tournaments.unshift(created.tournament);
  selectedTournamentId = created.tournament._id;
  renderTournaments();
}

async function selectTournament(id) {
  selectedTournamentId = id;
  renderTournaments();
  renderDay(currentDay);
}

async function seedTournament(id) {
  await Api.post(`/api/bracket/tournaments/${id}/seed`);
  await loadBracket();
}

async function completeTournament(id) {
  await Api.post(`/api/bracket/tournaments/${id}/complete`);
  await loadBracket();
}

async function hideTournament(id) {
  if (!confirm('Hide this tournament from the main view? (Data will be preserved)')) return;
  await Api.post(`/api/bracket/tournaments/${id}/hide`);
  await loadBracket();
}

async function showTournament(id) {
  await Api.post(`/api/bracket/tournaments/${id}/show`);
  await loadBracket();
}

async function deleteTournament(id) {
  if (!confirm('Delete this empty tournament? This action cannot be undone.')) return;
  try {
    await Api.del(`/api/bracket/tournaments/${id}/delete`);
    await loadBracket();
  } catch (e) {
    alert('Error deleting tournament: ' + e.message);
  }
}

(async function init() {
  await checkAuth();
  await checkSetup();
  renderAuthArea();
  await loadBracket();
})();
</script>
</body>
</html>
